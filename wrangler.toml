# Davet linki sunucusu + web app (Cloudflare Workers)
# Deploy: npm run deploy:web   → https://halisaha-kolik.<hesap-alt-alan-adın>.workers.dev
# Kurulum adımları: docs/DAVET_LINKI_KURULUM.md
name = "halisaha-kolik"
main = "build/_worker.js"
compatibility_date = "2024-12-01"

[assets]
directory = "./build"
binding = "ASSETS"

[vars]
SCHEME = "halisahakolik"
ANDROID_PACKAGE = "com.halisahakolik.app"
IOS_TEAM_ID = "Q3BH6457BX"
IOS_BUNDLE_ID = "com.halisahakolik.app"
# App Store Connect → Uygulama Bilgileri → "Apple Kimliği" (sadece rakam, örn. "6741234567")
IOS_APP_STORE_ID = ""
# Associated Domains içeren iOS sürümü yayındaysa "true" (codemagic.yaml → ENABLE_UNIVERSAL_LINKS)
IOS_UNIVERSAL_LINKS = "false"
# Play Console → Uygulama bütünlüğü → Uygulama imzalama anahtarı sertifikası → SHA-256
# Birden fazlaysa virgülle ayır. Boşken Android App Links doğrulanmaz (intent:// yine çalışır).
