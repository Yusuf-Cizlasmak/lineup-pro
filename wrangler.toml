# Davet linki sunucusu + web app (Cloudflare Workers)
# Deploy: npm run deploy:web   → https://davet.halisahakolik.com.tr
# Kurulum adımları: docs/DAVET_LINKI_KURULUM.md
name = "halisaha-kolik"
main = "build/_worker.js"
compatibility_date = "2024-12-01"

# Davet linkleri ALT ALAN ADINDA: kök domain (halisahakolik.com.tr) web sitene ait
# kalır. Deploy'dan ÖNCE domain'in DNS'i Cloudflare'de "Active" olmalı (aksi halde
# wrangler "Could not find zone" der). DNS kaydını wrangler kendisi oluşturur.
# Domain değişirse: src/deepLink.js WEB_BASE + ios App.entitlements + AndroidManifest host
#
# 2. satır: kök domainde açılan eski /m/ linklerini davet alt alan adına yönlendirir.
# Sadece kök domainin DNS kaydı Cloudflare'de "Proxied" (turuncu bulut) ise çalışır;
# değilse zararsızdır, web sitene dokunmaz.
routes = [
  { pattern = "davet.halisahakolik.com.tr", custom_domain = true },
  { pattern = "halisahakolik.com.tr/m/*", zone_name = "halisahakolik.com.tr" },
]
# *.workers.dev adresi yedek olarak açık kalsın
workers_dev = true

[assets]
directory = "./build"
binding = "ASSETS"

[vars]
SCHEME = "halisahakolik"
ANDROID_PACKAGE = "com.halisahakolik.app"
IOS_TEAM_ID = "Q3BH6457BX"
IOS_BUNDLE_ID = "com.halisahakolik.app"
# App Store Connect → Uygulama Bilgileri → "Apple Kimliği" (sadece rakam, örn. "6741234567")
IOS_APP_STORE_ID = ""
# Associated Domains içeren iOS sürümü yayındaysa "true" (codemagic.yaml → ENABLE_UNIVERSAL_LINKS)
IOS_UNIVERSAL_LINKS = "false"
# Play Console → Uygulama bütünlüğü → Uygulama imzalama anahtarı sertifikası → SHA-256
# Birden fazlaysa virgülle ayır. Boşken Android App Links doğrulanmaz (intent:// yine çalışır).
ANDROID_SHA256_FINGERPRINTS = ""
# Davet sayfasında maç bilgisini (saha, takımlar, saat) göstermek için.
# Anon key zaten uygulama içinde herkese açık (src/LiveMatchService.js) — gizli değildir.
# Davet linklerinin asıl adresi — başka host'tan gelen /m/ istekleri buraya yönlendirilir
PUBLIC_HOST = "davet.halisahakolik.com.tr"
