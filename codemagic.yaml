workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app
      node: 22
      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web
        script: CI=false npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Debug iOS structure
        script: |
          echo "=== ios/ ==="
          ls -la ios/ || echo "no ios dir"
          echo "=== ios/App/ ==="
          ls -la ios/App/ || echo "no ios/App dir"
          echo "=== Podfile location ==="
          find ios -name "Podfile" 2>/dev/null || echo "No Podfile found"
      - name: Install CocoaPods
        script: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -1)
          if [ -n "$PODFILE_DIR" ]; then
            cd "$PODFILE_DIR"
            pod install
          else
            echo "No Podfile found, skipping"
          fi
      - name: Set signing settings
        script: |
          cd ios/App
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ""/DEVELOPMENT_TEAM = "Q3BH6457BX"/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "Q3BH6457BX";/g' App.xcodeproj/project.pbxproj
      - name: Build iOS
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            DEVELOPMENT_TEAM="Q3BH6457BX" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="com.halisahakolik.app" \
            -destination "generic/platform=iOS" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            OTHER_CODE_SIGN_FLAGS="--keychain $HOME/Library/Keychains/codemagic.keychain-db" \
            | tee build.log || true
          
          if grep -q "Pods-App does not support provisioning profiles" build.log; then
            echo "Fixing Pods signing..."
            cd ios/App
            sed -i '' '/Pods-App/,/};/{s/PROVISIONING_PROFILE_SPECIFIER = .*/PROVISIONING_PROFILE_SPECIFIER = "";/g}' Pods/Pods.xcodeproj/project.pbxproj
            cd ../..
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              -archivePath build/App.xcarchive \
              archive \
              -destination "generic/platform=iOS" \
              COMPILER_INDEX_STORE_ENABLE=NO
          fi
      - name: Export IPA
        script: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>Q3BH6457BX</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.halisahakolik.app</key>
              <string>com.halisahakolik.app</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/output/**/*.ipa
      - build/**/*.xcarchive