workflows:
  ios-build:
    name: iOS Hybrid Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app

      node: 22

      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"
        # Marketing version — her store upload'unda mutlaka bump et.
        # Apple aynı versiyonu iki kez kabul etmez (Error 90062 / 90186).
        MARKETING_VERSION: "1.4"
        # App Store Connect'te bilinen en yüksek build numarası.
        # Yeni upload'larda otomatik tespit edersek bunu kullanmayız,
        # tespit başarısız olursa bu sayı taban olur.
        MIN_BUILD_NUMBER: "84"
        # Universal Links (davet linki app'i doğrudan açsın) — ios/App/App/App.entitlements
        # "true" yapmadan ÖNCE: developer.apple.com → Identifiers → com.halisahakolik.app
        # → "Associated Domains" kutusunu işaretle → Save. Aksi halde imzalama hata verir.
        # Sonra wrangler.toml → IOS_UNIVERSAL_LINKS = "true". Bkz. docs/DAVET_LINKI_KURULUM.md
        ENABLE_UNIVERSAL_LINKS: "false"
        # ★ Uzak bildirim (push · FCM) — "true" yapınca 3 şey birden açılır:
        #   1) @capacitor-firebase/messaging iOS build'e girer (false iken çıkarılır →
        #      Firebase SDK hiç derlenmez, build bugünkü gibi kalır)
        #   2) ios/App/App/GoogleService-Info.plist App target'a (Resources) eklenir
        #   3) App.entitlements'a aps-environment = production yazılır + imzaya eklenir
        # "true" yapmadan ÖNCE (yoksa imzalama hata verir):
        #   a) developer.apple.com → Identifiers → com.halisahakolik.app →
        #      "Push Notifications" kutusunu işaretle → Save
        #   b) developer.apple.com → Keys → "+" → Apple Push Notifications service (APNs)
        #      → .p8 indir → Firebase Console → Project Settings → Cloud Messaging →
        #      Apple app configuration → APNs Authentication Key → yükle (Key ID + Team ID)
        #   Adım adım: docs/BILDIRIM_KURULUM.md
        ENABLE_PUSH: "false"

    scripts:

      - name: Clean previous build
        script: |
          rm -rf node_modules build
          npm cache clean --force || true

      - name: Install dependencies
        script: |
          npm install
          npm install \
            @capacitor/ios \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/app \
            @capacitor/camera \
            @capacitor/share \
            @capacitor/filesystem \
            @capacitor/haptics \
            @capacitor/browser \
            @capacitor/status-bar \
            @capacitor/keyboard \
            @capacitor/local-notifications \
            @capacitor-community/admob \
            @capacitor-community/in-app-review \
            @revenuecat/purchases-capacitor \
            html-to-image \
            --save

          gem install xcodeproj --no-document

      - name: Build web
        script: CI=false npm run build

      - name: Sync Capacitor
        script: |
          # ★ Push kapalıysa Firebase Messaging eklentisini iOS build'den çıkar.
          #   (JS tarafı paketi import etmez — src/push.js sessizce no-op olur.)
          #   @capacitor/push-notifications ARTIK YOK: Firebase eklentisiyle çakışır.
          if [ "$ENABLE_PUSH" != "true" ]; then
            echo "ℹ️  ENABLE_PUSH=false → @capacitor-firebase/messaging iOS build'e eklenmiyor"
            npm uninstall @capacitor-firebase/messaging --no-audit --no-fund || \
              rm -rf node_modules/@capacitor-firebase/messaging
          else
            echo "🔔 ENABLE_PUSH=true → Firebase Messaging (SPM) iOS build'e ekleniyor"
          fi
          npx cap add ios || true
          npx cap sync ios
          echo "----- CapApp-SPM/Package.swift eklentileri -----"
          grep -E "\.package\(name" ios/App/CapApp-SPM/Package.swift || true

      # ★ App icon — AppIcon.png varsa 1024x1024 olarak App Store icon slot'una yaz
      - name: Set app icon
        script: |
          if [ ! -f "AppIcon.png" ]; then
            echo "AppIcon.png not found, using default"
            exit 0
          fi
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 1024 1024 AppIcon.png --out "$ICON_DIR/AppIcon-1024@1x.png"
          printf '{"images":[{"filename":"AppIcon-1024@1x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON_DIR/Contents.json"
          echo "App icon set"

      # ✅ Build numarasını ayarla — 3 kademeli güvenlik
      # 1. App Store Connect'ten en yüksek numarayı çek
      # 2. Başaramazsa Codemagic'in dahili BUILD_NUMBER'ını kullan
      # 3. İkisi de MIN_BUILD_NUMBER'dan küçükse onu kullan
      # Hangisi en yüksekse +1 yapıp Info.plist'e yaz
      - name: Set build number
        script: |
          set -e
          cd ios/App

          echo "🔍 Codemagic build number: $BUILD_NUMBER"
          echo "🔍 Min build number floor: $MIN_BUILD_NUMBER"

          # 1) App Store Connect'ten dene — bu sefer hatayı GÖRELİM
          echo "🔍 App Store Connect'ten en son build numarası çekiliyor..."
          ASC_BUILD=$(app-store-connect get-latest-build-number --bundle-id "$BUNDLE_ID" 2>&1 || echo "FAIL")
          echo "📦 ASC response: $ASC_BUILD"

          # Sayı değilse 0'a düşür
          if ! [[ "$ASC_BUILD" =~ ^[0-9]+$ ]]; then
            echo "⚠️  ASC tespiti başarısız oldu, fallback'e geçiliyor"
            ASC_BUILD=0
          fi

          # Codemagic'in BUILD_NUMBER değişkeni de sayı değilse 0
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            BUILD_NUMBER=0
          fi

          if ! [[ "$MIN_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            MIN_BUILD_NUMBER=0
          fi

          # En yükseğini al
          MAX=$ASC_BUILD
          if [ "$BUILD_NUMBER" -gt "$MAX" ]; then MAX=$BUILD_NUMBER; fi
          if [ "$MIN_BUILD_NUMBER" -gt "$MAX" ]; then MAX=$MIN_BUILD_NUMBER; fi

          NEW_BUILD=$((MAX + 1))
          echo "📦 ASC latest:      $ASC_BUILD"
          echo "📦 Codemagic build: $BUILD_NUMBER"
          echo "📦 Min floor:       $MIN_BUILD_NUMBER"
          echo "📦 Selected MAX:    $MAX"
          echo "✅ NEW build number: $NEW_BUILD"

          # Marketing version — hem agvtool hem PlistBuddy ile çift güvence
          agvtool new-marketing-version "$MARKETING_VERSION" || true
          # agvtool Capacitor pbxproj yapısında bazen tutmaz; PlistBuddy ile garantiye al
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $MARKETING_VERSION" "App/App/Info.plist" || \
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $MARKETING_VERSION" "App/App/Info.plist" || true
          echo "✅ Marketing version: $MARKETING_VERSION"
          agvtool new-version -all "$NEW_BUILD"

          cd ../..

      - name: Inject Info.plist usage descriptions
        script: |
          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist bulunamadı: $PLIST"
            exit 1
          fi

          add_or_set_string() {
            local key="$1"
            local value="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key \"$value\"" "$PLIST"
              echo "🔁 Updated $key"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string \"$value\"" "$PLIST"
              echo "➕ Added $key"
            fi
          }

          add_or_set_string "NSCameraUsageDescription" \
            "Oyuncu profili için fotoğraf çekmek üzere kameraya erişim gerekir."
          add_or_set_string "NSPhotoLibraryUsageDescription" \
            "Oyuncu profil fotoğrafı seçmek için galeriye erişim gerekir."
          add_or_set_string "NSPhotoLibraryAddUsageDescription" \
            "Oluşturulan kadro görselini galeriye kaydetmek için izin gerekir."

          # KRİTİK: AdMob iOS App ID — olmadan SDK crash/sessiz fail atar
          # npx cap sync bazen bunu üzerine yazabiliyor, garantiye alıyoruz
          add_or_set_string "GADApplicationIdentifier" \
            "$GAD_APP_ID"

          # KRİTİK: ATT dialog metni — iOS 14.5+ zorunlu
          # Bu olmadan ATT dialog açılmaz, tracking denied sayılır -> match rate 0
          add_or_set_string "NSUserTrackingUsageDescription" \
            "Size daha alakalı reklamlar göstermek için reklam kimliğinize erişim gereklidir."

          echo "----- Info.plist AdMob + ATT + Camera keys -----"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "Camera|Photo|GAD|Tracking" || echo "Eklenememiş!"

      - name: Detect provisioning profile
        script: |
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_PATH=""

          # ★ Birden çok profil varsa BUNDLE_ID'ye ait olanı seç; ENABLE_PUSH=true iken
          #   aps-environment içeren (Push capability açıldıktan SONRA üretilmiş) profili tercih et.
          for P in "$PROFILE_DIR"/*.mobileprovision; do
            [ -f "$P" ] || continue
            APPID=$(security cms -D -i "$P" 2>/dev/null | plutil -extract Entitlements.application-identifier raw - 2>/dev/null || echo "")
            case "$APPID" in
              *".$BUNDLE_ID") ;;
              *) continue ;;
            esac
            if [ "$ENABLE_PUSH" = "true" ]; then
              security cms -D -i "$P" 2>/dev/null | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1 || continue
            fi
            PROFILE_PATH="$P"
            break
          done

          # Eski davranış (yedek): ilk bulunan profil
          if [ -z "$PROFILE_PATH" ]; then
            PROFILE_PATH=$(find "$PROFILE_DIR" -name "*.mobileprovision" | head -1)
          fi

          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ Profile bulunamadı"
            exit 1
          fi

          if [ "$ENABLE_PUSH" = "true" ]; then
            if ! security cms -D -i "$PROFILE_PATH" | plutil -extract Entitlements.aps-environment raw - >/dev/null 2>&1; then
              echo "❌ ENABLE_PUSH=true ama provisioning profile'da aps-environment YOK."
              echo "   developer.apple.com → Identifiers → $BUNDLE_ID → Push Notifications ✔ → Save"
              echo "   Sonra Profiles → eski App Store profilini sil (Codemagic yenisini üretir) ve build'i tekrarla."
              echo "   Ya da push'u şimdilik kapat: ENABLE_PUSH: \"false\". Bkz. docs/BILDIRIM_KURULUM.md"
              exit 1
            fi
            echo "✅ Profil aps-environment içeriyor (push imzası hazır)"
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          echo "UUID: $PROFILE_UUID"
          echo "NAME: $PROFILE_NAME"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      # ★ Entitlements dosyası bayraklara göre BUILD SIRASINDA üretilir:
      #   ENABLE_UNIVERSAL_LINKS=true → associated-domains (repo'daki App.entitlements listesinden)
      #   ENABLE_PUSH=true            → aps-environment = production (TestFlight/App Store)
      #   İkisi de false → dosyaya dokunulmaz, imzaya da eklenmez (bugünkü davranış).
      - name: Generate entitlements
        script: |
          set -e
          ENT="ios/App/App/App.entitlements"
          PB=/usr/libexec/PlistBuddy

          if [ "$ENABLE_UNIVERSAL_LINKS" != "true" ] && [ "$ENABLE_PUSH" != "true" ]; then
            echo "ℹ️  Entitlement bayrağı yok — CODE_SIGN_ENTITLEMENTS ayarlanmayacak"
            exit 0
          fi

          # Repo'daki associated-domains listesini koru (tek doğruluk kaynağı)
          DOMAINS=""
          if [ -f "$ENT" ]; then
            i=0
            while D=$($PB -c "Print :com.apple.developer.associated-domains:$i" "$ENT" 2>/dev/null); do
              DOMAINS="$DOMAINS $D"
              i=$((i+1))
            done
          fi
          if [ -z "$DOMAINS" ]; then DOMAINS="applinks:davet.halisahakolik.com.tr"; fi

          # Sıfırdan üret
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' '<dict>' '</dict>' '</plist>' > "$ENT"

          if [ "$ENABLE_UNIVERSAL_LINKS" = "true" ]; then
            $PB -c "Add :com.apple.developer.associated-domains array" "$ENT"
            j=0
            for D in $DOMAINS; do
              $PB -c "Add :com.apple.developer.associated-domains:$j string $D" "$ENT"
              j=$((j+1))
            done
            echo "🔗 associated-domains:$DOMAINS"
          fi
          if [ "$ENABLE_PUSH" = "true" ]; then
            $PB -c "Add :aps-environment string production" "$ENT"
            echo "🔔 aps-environment = production"
          fi

          plutil -lint "$ENT"
          echo "----- App.entitlements -----"
          cat "$ENT"

      - name: Patch App target signing (Ruby)
        script: |
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          ruby <<RUBY
          # encoding: utf-8
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'App' }
          if target.nil?
            abort "❌ 'App' target bulunamadı"
          end

          enable_ul = '${ENABLE_UNIVERSAL_LINKS}' == 'true'
          enable_push = '${ENABLE_PUSH}' == 'true'
          # Entitlements yalnızca en az bir bayrak açıksa imzaya eklenir
          enable_ent = enable_ul || enable_push

          target.build_configurations.each do |config|
            attrs = config.build_settings
            attrs['CODE_SIGN_STYLE'] = 'Manual'
            attrs['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            attrs['DEVELOPMENT_TEAM'] = '${DEVELOPMENT_TEAM}'
            attrs['PROVISIONING_PROFILE_SPECIFIER'] = '${PROFILE_NAME}'
            attrs['PRODUCT_BUNDLE_IDENTIFIER'] = '${BUNDLE_ID}'
            # Universal Links / Push: üretilen App.entitlements'ı imzaya ekle
            attrs['CODE_SIGN_ENTITLEMENTS'] = 'App/App.entitlements' if enable_ent
            tags = []
            tags << 'Universal Links' if enable_ul
            tags << 'Push' if enable_push
            puts "✅ Patched config: #{config.name}#{tags.empty? ? '' : ' (+ ' + tags.join(', ') + ')'}"
          end

          # ★ Push: GoogleService-Info.plist App bundle'a girmeli (Firebase onu okuyup
          #   kendini yapılandırır). Dosya repo'da var ama pbxproj'da referansı yok →
          #   burada Resources build phase'ine ekliyoruz (pbxproj elle düzenlenmez).
          if enable_push
            gsi_disk = 'ios/App/App/GoogleService-Info.plist'
            unless File.exist?(gsi_disk)
              abort "❌ ENABLE_PUSH=true ama #{gsi_disk} yok (Firebase Console → iOS uygulaması → GoogleService-Info.plist indir)"
            end
            app_group = project.main_group.children.find { |g| g.isa == 'PBXGroup' && (g.path == 'App' || g.name == 'App') }
            abort "❌ Xcode'da 'App' grubu bulunamadı" if app_group.nil?
            ref = app_group.files.find { |f| f.path == 'GoogleService-Info.plist' }
            ref ||= app_group.new_reference('GoogleService-Info.plist')
            already = target.resources_build_phase.files_references.any? { |f| f && f.path == 'GoogleService-Info.plist' }
            target.add_resources([ref]) unless already
            puts "✅ GoogleService-Info.plist → App target Resources#{already ? ' (zaten vardı)' : ''}"
          end

          project.root_object.attributes['TargetAttributes'] ||= {}
          project.root_object.attributes['TargetAttributes'][target.uuid] ||= {}
          project.root_object.attributes['TargetAttributes'][target.uuid]['ProvisioningStyle'] = 'Manual'
          project.root_object.attributes['TargetAttributes'][target.uuid]['DevelopmentTeam'] = '${DEVELOPMENT_TEAM}'

          project.save
          puts "✅ pbxproj saved"
          RUBY

      - name: Build archive
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"

          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive yok"
            exit 1
          fi

          echo "✅ Archive OK"

      - name: Verify Info.plist in archive
        script: |
          ARCHIVE_PLIST="build/App.xcarchive/Products/Applications/App.app/Info.plist"
          if [ -f "$ARCHIVE_PLIST" ]; then
            echo "----- Archive Info.plist -----"
            echo -n "CFBundleVersion: "
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PLIST" || true
            echo -n "CFBundleShortVersionString: "
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST" || true
            VERSION=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST" 2>/dev/null || echo "unknown")
            if [ "$VERSION" != "$MARKETING_VERSION" ]; then
              echo "HATA: CFBundleShortVersionString=$VERSION, beklenen $MARKETING_VERSION"
              exit 1
            fi
            echo "Version dogru: $VERSION"
            /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSCameraUsageDescription YOK"
            /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSPhotoLibraryUsageDescription YOK"
            /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSPhotoLibraryAddUsageDescription YOK"
          else
            echo "⚠️ Archive plist bulunamadı"
          fi

          # ★ İmzadaki entitlement'lar (push / universal links gerçekten girdi mi?)
          APP_DIR="build/App.xcarchive/Products/Applications/App.app"
          echo "----- İmza entitlements -----"
          codesign -d --entitlements - --xml "$APP_DIR" 2>/dev/null | plutil -p - 2>/dev/null || \
            codesign -d --entitlements :- "$APP_DIR" 2>/dev/null || echo "⚠️ entitlements okunamadı"
          if [ "$ENABLE_PUSH" = "true" ]; then
            if [ -f "$APP_DIR/GoogleService-Info.plist" ]; then
              echo "✅ GoogleService-Info.plist bundle'da"
            else
              echo "❌ ENABLE_PUSH=true ama GoogleService-Info.plist bundle'da YOK"
              exit 1
            fi
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false