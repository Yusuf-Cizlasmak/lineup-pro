workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app
      node: 22
      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web
        script: CI=false npm run build
      - name: Add iOS platform
        script: npx cap add ios || true
      - name: Sync Capacitor
        script: npx cap sync ios
      - name: Install CocoaPods
        script: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -1)
          if [ -n "$PODFILE_DIR" ]; then
            cd "$PODFILE_DIR"
            pod install
          else
            echo "No Podfile found, skipping"
          fi
      - name: Fix signing for App only
        script: |
          cd ios/App
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = ""/DEVELOPMENT_TEAM = "Q3BH6457BX"/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "Q3BH6457BX";/g' App.xcodeproj/project.pbxproj
          
          # Pods target'ından provisioning profile'ı temizle
          if [ -f "Pods/Pods.xcodeproj/project.pbxproj" ]; then
            sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = ".*"/PROVISIONING_PROFILE_SPECIFIER = ""/g' Pods/Pods.xcodeproj/project.pbxproj
          fi
      - name: Build iOS Archive
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -destination "generic/platform=iOS" \
            DEVELOPMENT_TEAM="Q3BH6457BX" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="com.halisahakolik.app" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            archive
      - name: Export IPA
        script: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>Q3BH6457BX</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.halisahakolik.app</key>
              <string>com.halisahakolik.app</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build/output \
            -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/output/**/*.ipa
      - build/**/*.xcarchive