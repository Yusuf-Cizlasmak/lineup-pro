workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app
      node: 22
      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli @capacitor-community/admob @capacitor-community/in-app-review @capacitor/browser @capacitor/haptics @capacitor/camera --save

      - name: Build web
        script: CI=false npm run build

      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Configure Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_APP_ID" "$PLIST" 2>/dev/null || /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GADIsAdManagerApp bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string Oyuncu profili için kamera erişimi gereklidir." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string Galeri erişimi gereklidir." "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string Reklamları kişiselleştirmek için izin rica ediyoruz." "$PLIST" 2>/dev/null || true

      - name: Setup signing and Patch Project
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -1)
          
          if [ -n "$PROFILE_PATH" ]; then
            PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -A1 'UUID' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
            PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -A1 'Name' | head -1 | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
            echo "Found Profile: $PROFILE_NAME ($PROFILE_UUID)"
          else
            echo "ERROR: Provisioning profile not found!"
            exit 1
          fi

          # 1. Xcode projesinde 'Automatic' olan her şeyi 'Manual' yap
          sed -i '' "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g" "$PBXPROJ"
          
          # 2. PROVISIONING_PROFILE ayarını dosyaya yaz (Komut satırından geçmeyeceğiz)
          # Bu sayede sadece ana target etkilenir, SPM paketleri etkilenmez.
          sed -i '' "s/PROVISIONING_PROFILE = \".*\";/PROVISIONING_PROFILE = \"$PROFILE_UUID\";/g" "$PBXPROJ"
          sed -i '' "s/PROVISIONING_PROFILE = .*;/PROVISIONING_PROFILE = \"$PROFILE_UUID\";/g" "$PBXPROJ"
          
          # 3. Development Team'i ayarla
          sed -i '' "s/DEVELOPMENT_TEAM = \".*\";/DEVELOPMENT_TEAM = \"$DEVELOPMENT_TEAM\";/g" "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = \"$DEVELOPMENT_TEAM\";/g" "$PBXPROJ"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      - name: Build iOS archive
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"
          
          # ÖNEMLİ: Burada PROVISIONING_PROFILE parametresini KALDIRDIK. 
          # Çünkü yukarıdaki script ile bunu project.pbxproj içine zaten enjekte ettik.
          # Bu sayede SPM paketleri (IONCameraLib) kendi haline bırakılır.
          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            archive

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt)
          
          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.halisahakolik.app</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "build/output" \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration