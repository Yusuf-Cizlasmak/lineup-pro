workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app
      node: 22
      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Build web
        script: CI=false npm run build
      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Debug - find workspace
        script: |
          echo "=== Full ios structure ==="
          find ios -maxdepth 3 -type f \( -name "*.xcworkspace" -o -name "*.xcodeproj" -o -name "Podfile" \) 2>/dev/null
          echo "=== ios/App contents ==="
          ls -la ios/App/ 2>/dev/null || echo "ios/App not found"
          echo "=== ios contents ==="
          ls -la ios/ 2>/dev/null || echo "ios not found"
      - name: Install CocoaPods
        script: |
          PODFILE_DIR=$(find ios -name "Podfile" -exec dirname {} \; | head -1)
          if [ -n "$PODFILE_DIR" ]; then
            cd "$PODFILE_DIR"
            pod install
          else
            echo "No Podfile found"
          fi
      - name: Debug - find workspace after pods
        script: |
          echo "=== Workspace files ==="
          find ios -name "*.xcworkspace" 2>/dev/null
      - name: Fix signing
        script: |
          PBXPROJ=$(find ios -name "project.pbxproj" -path "*/App.xcodeproj/*" | head -1)
          if [ -n "$PBXPROJ" ]; then
            sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
            sed -i '' 's/DEVELOPMENT_TEAM = ""/DEVELOPMENT_TEAM = "Q3BH6457BX"/g' "$PBXPROJ"
            sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "Q3BH6457BX";/g' "$PBXPROJ"
          fi
      - name: Build iOS Archive
        script: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -1)
          if [ -z "$WORKSPACE" ]; then
            echo "No workspace found, trying xcodeproj"
            XCODEPROJ=$(find ios -name "App.xcodeproj" | head -1)
            xcodebuild -project "$XCODEPROJ" \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              -archivePath $CM_BUILD_DIR/build/App.xcarchive \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="Q3BH6457BX" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="com.halisahakolik.app" \
              archive
          else
            xcodebuild -workspace "$WORKSPACE" \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              -archivePath $CM_BUILD_DIR/build/App.xcarchive \
              -destination "generic/platform=iOS" \
              DEVELOPMENT_TEAM="Q3BH6457BX" \
              CODE_SIGN_STYLE="Manual" \
              CODE_SIGN_IDENTITY="Apple Distribution" \
              PROVISIONING_PROFILE_SPECIFIER="com.halisahakolik.app" \
              archive
          fi
      - name: Export IPA
        script: |
          cat > exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>Q3BH6457BX</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.halisahakolik.app</key>
              <string>com.halisahakolik.app</string>
            </dict>
          </dict>
          </plist>
          EOF
          
          xcodebuild -exportArchive \
            -archivePath $CM_BUILD_DIR/build/App.xcarchive \
            -exportPath $CM_BUILD_DIR/build/output \
            -exportOptionsPlist exportOptions.plist
    artifacts:
      - build/output/**/*.ipa
      - build/**/*.xcarchive