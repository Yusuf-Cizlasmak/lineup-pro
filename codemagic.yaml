workflows:
  ios-build:
    name: iOS Hybrid Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app

      node: 22

      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"

    scripts:

      - name: Install dependencies
        script: |
          npm install
          # Camera + diğer Capacitor plugin'leri
          npm install \
            @capacitor/ios \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/camera \
            @capacitor/share \
            @capacitor/filesystem \
            @capacitor-community/admob \
            --save

      - name: Build web
        script: CI=false npm run build

      - name: Sync Capacitor
        script: |
          npx cap add ios || true
          npx cap sync ios

      # ✅ Info.plist'e camera/photo usage description ekle
      # Bu olmazsa Camera.getPhoto çağrılır çağrılmaz iOS uygulamayı öldürür.
      - name: Inject Info.plist usage descriptions
        script: |
          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist bulunamadı: $PLIST"
            exit 1
          fi

          add_or_set_string() {
            local key="$1"
            local value="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key \"$value\"" "$PLIST"
              echo "🔁 Updated $key"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string \"$value\"" "$PLIST"
              echo "➕ Added $key"
            fi
          }

          add_or_set_string "NSCameraUsageDescription" \
            "Oyuncu profili için fotoğraf çekmek üzere kameraya erişim gerekir."
          add_or_set_string "NSPhotoLibraryUsageDescription" \
            "Oyuncu profil fotoğrafı seçmek için galeriye erişim gerekir."
          add_or_set_string "NSPhotoLibraryAddUsageDescription" \
            "Oluşturulan kadro görselini galeriye kaydetmek için izin gerekir."

          echo "----- Info.plist sonucu -----"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "Camera|Photo" || true

      # ✅ Profile bul
      - name: Detect provisioning profile
        script: |
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)

          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ Profile bulunamadı"
            exit 1
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          echo "UUID: $PROFILE_UUID"
          echo "NAME: $PROFILE_NAME"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      # ✅ Signing patch — pbxproj'u sed ile bozmak yerine xcconfig kullan
      # Tek bir override.xcconfig dosyası yazıyoruz, xcodebuild'e -xcconfig ile
      # geçeceğiz. Bu pbxproj'a hiç dokunmadığı için "damaged project" hatası olmaz.
      - name: Create signing xcconfig
        script: |
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          cat > /tmp/signing.xcconfig <<EOF
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID
          EOF

          echo "----- signing.xcconfig -----"
          cat /tmp/signing.xcconfig

      - name: Build archive
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"

          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -xcconfig /tmp/signing.xcconfig \
            -allowProvisioningUpdates \
            archive

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive yok"
            exit 1
          fi

          echo "✅ Archive OK"

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa