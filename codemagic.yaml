workflows:
  ios-build:
    name: iOS Hybrid Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app

      node: 22

      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"
        # App Store Connect'te bilinen en yüksek build numarası.
        # Yeni upload'larda otomatik tespit edersek bunu kullanmayız,
        # tespit başarısız olursa bu sayı taban olur.
        MIN_BUILD_NUMBER: "37"

    scripts:

      - name: Clean previous build
        script: |
          rm -rf node_modules build
          npm cache clean --force || true

    

      - name: Install dependencies

      
        script: |
          npm install
          npm install \
            @capacitor/ios \
            @capacitor/core \
            @capacitor/cli \
            @capacitor/camera \
            @capacitor/share \
            @capacitor/filesystem \
            @capacitor-community/admob \
            --save

          gem install xcodeproj --no-document

      - name: Build web
        script: CI=false npm run build

      - name: Sync Capacitor
        script: |
          npx cap add ios || true
          npx cap sync ios

      # ★ App icon — AppIcon.png varsa 1024x1024 olarak App Store icon slot'una yaz
      - name: Set app icon
        script: |
          if [ ! -f "AppIcon.png" ]; then
            echo "AppIcon.png not found, using default"
            exit 0
          fi
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 1024 1024 AppIcon.png --out "$ICON_DIR/AppIcon-1024@1x.png"
          printf '{"images":[{"filename":"AppIcon-1024@1x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON_DIR/Contents.json"
          echo "App icon set"

      # ✅ Build numarasını ayarla — 3 kademeli güvenlik
      # 1. App Store Connect'ten en yüksek numarayı çek
      # 2. Başaramazsa Codemagic'in dahili BUILD_NUMBER'ını kullan
      # 3. İkisi de MIN_BUILD_NUMBER'dan küçükse onu kullan
      # Hangisi en yüksekse +1 yapıp Info.plist'e yaz
      - name: Set build number
        script: |
          set -e
          cd ios/App

          echo "🔍 Codemagic build number: $BUILD_NUMBER"
          echo "🔍 Min build number floor: $MIN_BUILD_NUMBER"

          # 1) App Store Connect'ten dene — bu sefer hatayı GÖRELİM
          echo "🔍 App Store Connect'ten en son build numarası çekiliyor..."
          ASC_BUILD=$(app-store-connect get-latest-build-number --bundle-id "$BUNDLE_ID" 2>&1 || echo "FAIL")
          echo "📦 ASC response: $ASC_BUILD"

          # Sayı değilse 0'a düşür
          if ! [[ "$ASC_BUILD" =~ ^[0-9]+$ ]]; then
            echo "⚠️  ASC tespiti başarısız oldu, fallback'e geçiliyor"
            ASC_BUILD=0
          fi

          # Codemagic'in BUILD_NUMBER değişkeni de sayı değilse 0
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            BUILD_NUMBER=0
          fi

          if ! [[ "$MIN_BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            MIN_BUILD_NUMBER=0
          fi

          # En yükseğini al
          MAX=$ASC_BUILD
          if [ "$BUILD_NUMBER" -gt "$MAX" ]; then MAX=$BUILD_NUMBER; fi
          if [ "$MIN_BUILD_NUMBER" -gt "$MAX" ]; then MAX=$MIN_BUILD_NUMBER; fi

          NEW_BUILD=$((MAX + 1))
          echo "📦 ASC latest:      $ASC_BUILD"
          echo "📦 Codemagic build: $BUILD_NUMBER"
          echo "📦 Min floor:       $MIN_BUILD_NUMBER"
          echo "📦 Selected MAX:    $MAX"
          echo "✅ NEW build number: $NEW_BUILD"

          agvtool new-version -all "$NEW_BUILD"

          cd ../..

      - name: Inject Info.plist usage descriptions
        script: |
          PLIST="ios/App/App/Info.plist"

          if [ ! -f "$PLIST" ]; then
            echo "❌ Info.plist bulunamadı: $PLIST"
            exit 1
          fi

          add_or_set_string() {
            local key="$1"
            local value="$2"
            if /usr/libexec/PlistBuddy -c "Print :$key" "$PLIST" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :$key \"$value\"" "$PLIST"
              echo "🔁 Updated $key"
            else
              /usr/libexec/PlistBuddy -c "Add :$key string \"$value\"" "$PLIST"
              echo "➕ Added $key"
            fi
          }

          add_or_set_string "NSCameraUsageDescription" \
            "Oyuncu profili için fotoğraf çekmek üzere kameraya erişim gerekir."
          add_or_set_string "NSPhotoLibraryUsageDescription" \
            "Oyuncu profil fotoğrafı seçmek için galeriye erişim gerekir."
          add_or_set_string "NSPhotoLibraryAddUsageDescription" \
            "Oluşturulan kadro görselini galeriye kaydetmek için izin gerekir."

          # KRİTİK: AdMob iOS App ID — olmadan SDK crash/sessiz fail atar
          # npx cap sync bazen bunu üzerine yazabiliyor, garantiye alıyoruz
          add_or_set_string "GADApplicationIdentifier" \
            "$GAD_APP_ID"

          # KRİTİK: ATT dialog metni — iOS 14.5+ zorunlu
          # Bu olmadan ATT dialog açılmaz, tracking denied sayılır -> match rate 0
          add_or_set_string "NSUserTrackingUsageDescription" \
            "Size daha alakalı reklamlar göstermek için reklam kimliğinize erişim gereklidir."

          echo "----- Info.plist AdMob + ATT + Camera keys -----"
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | grep -E "Camera|Photo|GAD|Tracking" || echo "Eklenememiş!"

      - name: Detect provisioning profile
        script: |
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)

          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ Profile bulunamadı"
            exit 1
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | plutil -extract Name raw -)

          echo "UUID: $PROFILE_UUID"
          echo "NAME: $PROFILE_NAME"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      - name: Patch App target signing (Ruby)
        script: |
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          ruby <<RUBY
          require 'xcodeproj'

          project_path = 'ios/App/App.xcodeproj'
          project = Xcodeproj::Project.open(project_path)

          target = project.targets.find { |t| t.name == 'App' }
          if target.nil?
            abort "❌ 'App' target bulunamadı"
          end

          target.build_configurations.each do |config|
            attrs = config.build_settings
            attrs['CODE_SIGN_STYLE'] = 'Manual'
            attrs['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            attrs['DEVELOPMENT_TEAM'] = '${DEVELOPMENT_TEAM}'
            attrs['PROVISIONING_PROFILE_SPECIFIER'] = '${PROFILE_NAME}'
            attrs['PRODUCT_BUNDLE_IDENTIFIER'] = '${BUNDLE_ID}'
            puts "✅ Patched config: #{config.name}"
          end

          project.root_object.attributes['TargetAttributes'] ||= {}
          project.root_object.attributes['TargetAttributes'][target.uuid] ||= {}
          project.root_object.attributes['TargetAttributes'][target.uuid]['ProvisioningStyle'] = 'Manual'
          project.root_object.attributes['TargetAttributes'][target.uuid]['DevelopmentTeam'] = '${DEVELOPMENT_TEAM}'

          project.save
          puts "✅ pbxproj saved"
          RUBY

      - name: Build archive
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"

          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive yok"
            exit 1
          fi

          echo "✅ Archive OK"

      - name: Verify Info.plist in archive
        script: |
          ARCHIVE_PLIST="build/App.xcarchive/Products/Applications/App.app/Info.plist"
          if [ -f "$ARCHIVE_PLIST" ]; then
            echo "----- Archive Info.plist -----"
            echo -n "CFBundleVersion: "
            /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$ARCHIVE_PLIST" || true
            echo -n "CFBundleShortVersionString: "
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$ARCHIVE_PLIST" || true
            /usr/libexec/PlistBuddy -c "Print :NSCameraUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSCameraUsageDescription YOK"
            /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSPhotoLibraryUsageDescription YOK"
            /usr/libexec/PlistBuddy -c "Print :NSPhotoLibraryAddUsageDescription" "$ARCHIVE_PLIST" || echo "⚠️ NSPhotoLibraryAddUsageDescription YOK"
          else
            echo "⚠️ Archive plist bulunamadı"
          fi

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false