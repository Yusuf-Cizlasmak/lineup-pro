workflows:
  ios-build:
    name: iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app
      node: 22
      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli @capacitor-community/admob --save

      - name: Build web
        script: CI=false npm run build

      - name: Add iOS platform
        script: |
          npx cap add ios || true
          npx cap sync ios

      - name: Set app icon
        script: |
          if [ ! -f "AppIcon.png" ]; then
            echo "AppIcon.png not found, using default"
            exit 0
          fi
          ICON_DIR="ios/App/App/Assets.xcassets/AppIcon.appiconset"
          sips -z 1024 1024 AppIcon.png --out "$ICON_DIR/AppIcon-1024@1x.png"
          printf '{"images":[{"filename":"AppIcon-1024@1x.png","idiom":"universal","platform":"ios","size":"1024x1024"}],"info":{"author":"xcode","version":1}}' > "$ICON_DIR/Contents.json"
          echo "App icon set"

      - name: Configure Info.plist
        script: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :GADApplicationIdentifier string $GAD_APP_ID" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :GADApplicationIdentifier $GAD_APP_ID" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :GADIsAdManagerApp bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems array" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0 dict" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SKAdNetworkItems:0:SKAdNetworkIdentifier string cstr6suwn9.skadnetwork" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppManagesNonExemptEncryption bool false" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSUserTrackingUsageDescription string Size daha iyi reklam deneyimi sunmak icin izninizi istiyoruz." "$PLIST" 2>/dev/null || true
          echo "GADApplicationIdentifier = $(/usr/libexec/PlistBuddy -c 'Print :GADApplicationIdentifier' "$PLIST")"
          echo "GADIsAdManagerApp = $(/usr/libexec/PlistBuddy -c 'Print :GADIsAdManagerApp' "$PLIST")"

      - name: Setup signing
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"

          # Codemagic'in indirdigi provisioning profile'i bul
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" 2>/dev/null | head -1)
          if [ -n "$PROFILE_PATH" ]; then
            PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -A1 'UUID' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
            PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" 2>/dev/null | grep -A1 'Name' | head -1 | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
            echo "Profile: $PROFILE_NAME ($PROFILE_UUID)"
          else
            echo "WARNING: No provisioning profile found"
            PROFILE_UUID=""
            PROFILE_NAME=""
          fi

          # pbxproj guncelle
          sed -i '' "s/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g" "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = \"\"/DEVELOPMENT_TEAM = \"$DEVELOPMENT_TEAM\"/g" "$PBXPROJ"
          sed -i '' "s/DEVELOPMENT_TEAM = \"\";/DEVELOPMENT_TEAM = \"$DEVELOPMENT_TEAM\";/g" "$PBXPROJ"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt
          echo "Signing setup done"

      - name: Increment build number
        script: |
          PLIST="ios/App/App/Info.plist"
          BUILD_NUM=${BUILD_NUMBER:-1}
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUM" "$PLIST"
          echo "Build number: $BUILD_NUM"

      - name: Build iOS archive
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt 2>/dev/null || echo "")

          echo "Project: $XCODE_PROJ"
          echo "Profile UUID: $PROFILE_UUID"

          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            archive

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "Archive bulunamadi!"
            find . -name "*.xcarchive" -type d 2>/dev/null
            exit 1
          fi
          echo "Archive olusturuldu"

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt 2>/dev/null || echo "")
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt 2>/dev/null || echo "")
          PROFILE_REF="${PROFILE_NAME:-$PROFILE_UUID}"

          printf '%s\n' '<?xml version="1.0" encoding="UTF-8"?>' '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' '<plist version="1.0">' '<dict>' '  <key>method</key>' '  <string>app-store</string>' '  <key>teamID</key>' '  <string>Q3BH6457BX</string>' '  <key>signingStyle</key>' '  <string>manual</string>' '  <key>uploadBitcode</key>' '  <false/>' '  <key>uploadSymbols</key>' '  <true/>' '  <key>provisioningProfiles</key>' '  <dict>' "    <key>com.halisahakolik.app</key>" "    <string>${PROFILE_REF}</string>" '  </dict>' '</dict>' '</plist>' > exportOptions.plist

          cat exportOptions.plist

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "build/output" \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa
      - build/**/*.xcarchive

    publishing:
      app_store_connect:
        auth: integration