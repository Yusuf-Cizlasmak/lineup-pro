workflows:
  ios-build:
    name: iOS Hybrid Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Man

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.halisahakolik.app

      node: 22

      vars:
        DEVELOPMENT_TEAM: "Q3BH6457BX"
        BUNDLE_ID: "com.halisahakolik.app"
        GAD_APP_ID: "ca-app-pub-2886543552287006~5889085689"

    scripts:

      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli @capacitor-community/admob --save

      - name: Build web
        script: CI=false npm run build

      - name: Sync Capacitor
        script: |
          npx cap add ios || true
          npx cap sync ios

      # ✅ Profile bul (ama global kullanma!)
      - name: Detect provisioning profile
        script: |
          PROFILE_PATH=$(find "$HOME/Library/MobileDevice/Provisioning Profiles" -name "*.mobileprovision" | head -1)

          if [ -z "$PROFILE_PATH" ]; then
            echo "❌ Profile bulunamadı"
            exit 1
          fi

          PROFILE_UUID=$(security cms -D -i "$PROFILE_PATH" | grep -A1 'UUID' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')
          PROFILE_NAME=$(security cms -D -i "$PROFILE_PATH" | grep -A1 'Name' | grep '<string>' | sed 's/.*<string>\(.*\)<\/string>/\1/')

          echo "UUID: $PROFILE_UUID"
          echo "NAME: $PROFILE_NAME"

          echo "$PROFILE_UUID" > /tmp/profile_uuid.txt
          echo "$PROFILE_NAME" > /tmp/profile_name.txt

      # 🔥 SADECE APP TARGET'I PATCHLE
      - name: Patch signing ONLY for App target
        script: |
          PBXPROJ="ios/App/App.xcodeproj/project.pbxproj"
          PROFILE_UUID=$(cat /tmp/profile_uuid.txt)

          # Sadece App target'a provisioning profile ekle
          sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/a\\
                  PROVISIONING_PROFILE = $PROFILE_UUID;
          " "$PBXPROJ"

          sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/a\\
                  CODE_SIGN_IDENTITY = Apple Distribution;
          " "$PBXPROJ"

          sed -i '' "/PRODUCT_BUNDLE_IDENTIFIER = $BUNDLE_ID;/a\\
                  DEVELOPMENT_TEAM = $DEVELOPMENT_TEAM;
          " "$PBXPROJ"

          echo "✅ Only App target patched"

      - name: Build archive (NO global signing override)
        script: |
          XCODE_PROJ="ios/App/App.xcodeproj"
          ARCHIVE_PATH="build/App.xcarchive"

          xcodebuild \
            -project "$XCODE_PROJ" \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$ARCHIVE_PATH" \
            -destination "generic/platform=iOS" \
            -allowProvisioningUpdates \
            archive

          if [ ! -d "$ARCHIVE_PATH" ]; then
            echo "❌ Archive yok"
            exit 1
          fi

          echo "✅ Archive OK"

      - name: Export IPA
        script: |
          ARCHIVE_PATH="build/App.xcarchive"
          PROFILE_NAME=$(cat /tmp/profile_name.txt)

          cat > exportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>$DEVELOPMENT_TEAM</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/output \
            -exportOptionsPlist exportOptions.plist

    artifacts:
      - build/output/**/*.ipa